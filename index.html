<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facebook</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #fff;
  }


 
  .main {
    
    display: flex;
    align-items: center;
    min-height: 90vh;
  }


  .left {
    flex: 1;
    max-width: 720px;
    padding: 60px 80px;
    border-right: 1px solid #ddd; 
    align-self: stretch;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .fb-logo {
    color: #1877f2;
    width: 80px;
    margin-bottom: 30px;
  }

  .fb-logo svg {
    width: 80px;
    height: 80px;
    fill: #1877f2;
  }

 
  .collage {
    width: 100%;
    max-width: 600px;
    margin-bottom: 20px;
  }

  .collage img {
    width: 100%;
    height: auto;
    display: block;
  }

  .headline {
    font-size: 52px;
    font-weight: bold;
    line-height: 1.2;
    color: #1c1e21;
  }

  .headline .accent {
    color: #1877f2;
  }

 
  .right {
    flex: 1;
    max-width: 600px;
    padding: 60px 80px;
  }

  .login-header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 30px;
  }

  .back-arrow {
    font-size: 20px;
    color: #1c1e21;
    text-decoration: none;
  }

  .login-header h1 {
    font-size: 26px;
  }

  /* floating label inputs */
  .input-group {
    position: relative;
    margin-bottom: 14px;
  }

  .input-group input {
    width: 100%;
    padding: 22px 16px 8px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    background: transparent;
    outline: none;
    transition: border-color 0.15s ease;
  }

  .input-group input:focus {
    border-color: #0866ff;
  }

  .input-group label {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    color: #90949c;
    background: white;
    padding: 0 4px;
    pointer-events: none;
    transition: all 0.15s ease;
  }

  
  .input-group input:focus + label,
  .input-group input:not(:placeholder-shown) + label {
    top: 0;
    font-size: 12px;
    color: #0866ff;
  }

  .login-btn {
    width: 100%;
    padding: 15px;
    background: #0866ff;
    color: white;
    border: none;
    border-radius: 999px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 18px;
  }

  .login-btn:hover {
    background: #0653d3;
  }

  .forgot-link {
    display: block;
    text-align: center;
    color: #1877f2;
    text-decoration: none;
    margin-bottom: 40px;
    font-size: 15px;
  }

  .forgot-link:hover {
    text-decoration: underline;
  }

  .create-btn {
    display: block;
    width: 100%;
    padding: 15px;
    background: white;
    color: #0866ff;
    text-align: center;
    border: 1px solid #0866ff;
    border-radius: 999px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    text-decoration: none;
  }

  .create-btn:hover {
    background: #f0f6ff;
  }

  .meta-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 40px;
    color: #999;
    font-weight: bold;
    font-size: 18px;
  }

  .meta-logo svg {
    width: 22px;
    height: 22px;
    fill: #999;
  }

  /* ---------- responsive ---------- */
  @media screen and (max-width: 900px) {
    .main {
      flex-direction: column;
      min-height: auto;
    }

    .left {
      max-width: 100%;
      width: 100%;
      border-right: none;
      border-bottom: 1px solid #ddd;
      padding: 40px 30px;
    }

    .right {
      max-width: 100%;
      width: 100%;
      padding: 40px 30px;
    }

    .content-row {
      flex-direction: column;
      gap: 20px;
    }

    .collage {
      max-width: 320px;
    }

    .headline {
      font-size: 32px;
      text-align: center;
    }
  }

  @media screen and (max-width: 480px) {
    .titlebar span,
    .address-bar {
      font-size: 12px;
    }

    .fb-logo,
    .fb-logo svg {
      width: 56px;
      height: 56px;
    }

    .headline {
      font-size: 26px;
    }

    .login-header h1 {
      font-size: 22px;
    }

    .left,
    .right {
      padding: 30px 20px;
    }
  }
</style>
</head>
<body>

 

  <div class="main">

  
    <div class="left">
      <div class="fb-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M576 320C576 178.6 461.4 64 320 64C178.6 64 64 178.6 64 320C64 440 146.7 540.8 258.2 568.5L258.2 398.2L205.4 398.2L205.4 320L258.2 320L258.2 286.3C258.2 199.2 297.6 158.8 383.2 158.8C399.4 158.8 427.4 162 438.9 165.2L438.9 236C432.9 235.4 422.4 235 409.3 235C367.3 235 351.1 250.9 351.1 292.2L351.1 320L434.7 320L420.3 398.2L351 398.2L351 574.1C477.8 558.8 576 450.9 576 320z"/></svg>
      </div>

      <div class="collage">
      <img src="facebook pics.webp">      </div>

      <div class="headline">
        Explore the things<br>
        you <span class="accent">love.</span>
      </div>
    </div>

    <div class="right">
      <div class="login-header">
        <h1>Log in to Facebook</h1>
      </div>

      <div class="login-box">
        <div class="input-group">
          <input type="text" id="email" placeholder=" ">
          <label for="email">Email address or mobile number</label>
        </div>
        <div class="input-group">
          <input type="password" id="password" placeholder=" ">
          <label for="password">Password</label>
        </div>
        <button class="login-btn">Log in</button>
        <a href="#" class="forgot-link">Forgotten password?</a>
       <a href="signup.html" class="create-btn">Create new account</a>
      </div>

      <div class="meta-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M640 381.9C640 473.2 600.6 530.4 529.7 530.4C467.1 530.4 433.9 495.8 372.8 393.8L341.4 341.2C333.1 328.7 326.9 317 320.2 306.2C300.1 340 273.1 389.2 273.1 389.2C206.1 505.8 168.5 530.4 116.2 530.4C43.4 530.4 0 473.1 0 384.5C0 241.5 79.8 106.4 183.9 106.4C234.1 106.4 277.7 131.1 328.7 195.9C365.8 145.8 406.8 106.4 459.3 106.4C558.4 106.4 640 232.1 640 381.9zM287.4 256.2C244.5 194.1 216.5 175.7 183 175.7C121.1 175.7 69.2 281.8 69.2 385.7C69.2 434.2 87.7 461.4 118.8 461.4C149 461.4 167.8 442.4 222 357.6C222 357.6 246.7 318.5 287.4 256.2zM531.2 461.4C563.4 461.4 578.1 433.9 578.1 386.5C578.1 262.3 523.8 161.1 454.9 161.1C421.7 161.1 393.8 187 360 239.1C369.4 252.9 379.1 268.1 389.3 284.5L426.8 346.9C485.5 441 500.3 461.4 531.2 461.4z"/></svg>
        <span>Meta</span>
      </div>
    </div>

  </div>

</body>
</html>
